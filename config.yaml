title: FOIA Coach Tag Manager
description: >-
  Sets each document's `Type` tag to one of the FOIA Coach standard values:
  Retention Schedule, Guide, Court Opinion, Administrative Opinion, Records Log,
  Request or Other. Old spellings such as "Retention Schedules" or "AG Opinion" are
  renamed, and a missing `Type` is filled from `_tag` or `Tags` when they agree.
  Anything it can't map is reported, never guessed.
instructions: >-
  Run it once without "Apply changes" and check the CSV report. Then run it again with
  "Apply changes" checked. Only the `Type` key is changed; other keys are left alone.
disclosures: This Add-On does not use any third party services.
type: object
documents:
  - selected
  - query
properties:
  apply:
    title: Apply changes
    description: Leave unchecked to only produce a report of what would change.
    type: boolean
    default: false
  untagged_type:
    title: Type for untagged documents
    description: >-
      Optional. Given to documents with no `Type`, `_tag` or `Tags` at all. Select only
      documents you know are this type.
    type: string
    enum:
      - Retention Schedule
      - Guide
      - Court Opinion
      - Administrative Opinion
      - Records Log
      - Request
      - Other
categories:
  - bulk
version: 2
